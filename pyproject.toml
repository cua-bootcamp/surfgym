[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "environment",
    "environment/**",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
surfgym-contracts = { workspace = true }
surfgym-runtime = { workspace = true }
surfgym-task = { workspace = true }
surfgym-fixture = { workspace = true }

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.19",
]
