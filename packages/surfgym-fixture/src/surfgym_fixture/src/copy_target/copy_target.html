<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy Target</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #f6f7f9;
        color: #111827;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      section {
        width: min(560px, 100%);
        padding: 28px;
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0 0 18px;
        color: #4b5563;
      }

      textarea {
        width: 100%;
        height: 112px;
        box-sizing: border-box;
        padding: 14px;
        font: 20px/1.4 monospace;
        border: 1px solid #9ca3af;
        border-radius: 6px;
        resize: none;
      }

      #status {
        margin-top: 12px;
        min-height: 20px;
        font-weight: 700;
      }

      .pass {
        color: #047857;
      }

      .pending {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="target-title">
        <h1 id="target-title">Target Browser</h1>
        <p>Paste the copied text here.</p>
        <textarea id="answer" aria-label="answer field"></textarea>
        <div id="status" class="pending" aria-live="polite">Waiting for answer.</div>
      </section>
    </main>

    <script>
      const expected = "SURFGYM-MULTI-BROWSER-7429";
      const answer = document.getElementById("answer");
      const status = document.getElementById("status");

      const render = () => {
        if (answer.value === expected) {
          status.textContent = "Correct.";
          status.className = "pass";
        } else {
          status.textContent = "Waiting for answer.";
          status.className = "pending";
        }
      };

      answer.addEventListener("input", render);
      render();
    </script>
  </body>
</html>
